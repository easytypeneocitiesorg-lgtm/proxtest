<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Container</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            background-color: #111;
        }
        #blankFrame { 
            width: 100%; 
            height: 100%; 
            border: none; 
        }
    </style>
</head>
<body>

    <iframe id="blankFrame" src="about:blank"></iframe>

    <script>
        const yourVercelDomain = 'https://network-nine-alpha.vercel.app'; 
        const targetURL = 'https://core-logic-utils.github.io';
        const relayURL = `${yourVercelDomain}/api/relay?url=${encodeURIComponent(targetURL)}`;

        fetch(relayURL)
            .then(response => response.text())
            .then(html => {
                if (html.includes('<head>')) {
                    html = html.replace('<head>', `<head><base href="${targetURL}/">`);
                } else {
                    html = `<base href="${targetURL}/">` + html;
                }

                // Target the about:blank iframe's document
                const blankWindow = document.getElementById('blankFrame').contentWindow;
                const blankDoc = blankWindow.document;

                // Write the nested structure into about:blank
                blankDoc.open();
                blankDoc.write(`
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <style>
                            body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #111; }
                            #contentFrame { width: 100%; height: 100%; border: none; }
                        </style>
                    </head>
                    <body>
                        <iframe id="contentFrame"></iframe>
                        <script>
                            document.getElementById('contentFrame').srcdoc = ${JSON.stringify(html)};
                        <\/script>
                    </body>
                    </html>
                `);
                blankDoc.close();
            })
            .catch(error => console.error("Error loading site:", error));
    </script>
</body>
</html>
