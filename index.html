</head>

<body>

<iframe id="blankFrame" src="about:blank"></iframe>

<script>
    const yourVercelDomain = 'https://network-nine-alpha.vercel.app';
    const targetURL = 'https://core-logic-utils.github.io';

    const relayURL =
        `${yourVercelDomain}/api/relay?url=${encodeURIComponent(targetURL)}`;

    async function loadSite() {
        try {
            console.log('Requesting:', relayURL);

            const response = await fetch(relayURL);

            console.log('Proxy response:', response.status, response.statusText);

            if (!response.ok) {
                throw new Error(
                    `Proxy returned ${response.status} ${response.statusText}`
                );
            }

            let html = await response.text();

            console.log('Received HTML length:', html.length);

            if (!html || !html.trim()) {
                throw new Error('Proxy returned an empty response.');
            }

            /*
             * Add a base URL so relative resources such as:
             *
             * /style.css
             * /script.js
             * images/foo.png
             *
             * resolve against the target website.
             */
            if (/<head\b[^>]*>/i.test(html)) {
                html = html.replace(
                    /<head\b[^>]*>/i,
                    match => `${match}<base href="${targetURL}/">`
                );
            } else {
                html = `<base href="${targetURL}/">${html}`;
            }

            const blankFrame = document.getElementById('blankFrame');
            const blankDoc = blankFrame.contentWindow.document;

            /*
             * Keep the original nested iframe design.
             */
            blankDoc.open();

            blankDoc.write(`
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">

                    <style>
                        html, body {
                            margin: 0;
                            padding: 0;
                            width: 100%;
                            height: 100%;
                            overflow: hidden;
                            background: #111;
                        }

                        #contentFrame {
                            width: 100%;
                            height: 100%;
                            border: none;
                            display: block;
                        }
                    </style>

```
            </head>

            <body>
                <iframe id="contentFrame"></iframe>

                <script>
                    const page =
                        ${JSON.stringify(html)};

                    document.getElementById('contentFrame').srcdoc = page;
                <\/script>
            </body>
            </html>
        `);

        blankDoc.close();

        console.log('Proxied page inserted successfully.');

    } catch (error) {
        console.error('Error loading site through proxy:', error);

        document.body.innerHTML = `
            <div style="
                color: white;
                font-family: Arial, sans-serif;
                padding: 30px;
            ">
                <h2>Proxy loading failed</h2>
                <pre style="white-space: pre-wrap;">${error.message}</pre>
            </div>
        `;
    }
}

loadSite();
