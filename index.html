<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resources</title>
<link rel="icon" href="https://support.highlandschools.org/wp-content/uploads/2020/11/clever1.png" type="image/png">
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: #fff;
  font-family: sans-serif;
}
#x1 {
  width: 100%;
  height: 100%;
  border: none;
}
#x2 {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
</style>
</head>
<body>
<div id="x2">Loading...</div>
<iframe id="x1"></iframe>
<script>
(function() {
  const relayBase = "https://network-98.network-logic.deno.net";
  const targetOrigin = "https://core-logic-utils.github.io";
  const proxyUrl = relayBase + "/api/relay.js?url=" + encodeURIComponent(targetOrigin);
  
  fetch(proxyUrl)
    .then(function(response) {
      if (!response.ok) throw new Error("fetch failed");
      return response.text();
    })
    .then(function(html) {
      document.getElementById("x2").style.display = "none";
      
      // Inject base tag so relative links on the main dashboard resolve correctly
      let processed = html;
      const baseTag = '<base href="' + targetOrigin + '/">';
      if (processed.toLowerCase().includes('<head>')) {
        processed = processed.replace(/<head>/i, '<head>\n' + baseTag);
      } else {
        processed = baseTag + '\n' + processed;
      }
      document.getElementById("x1").srcdoc = processed;
    })
    .catch(function(err) {
      console.log("error", err);
      document.getElementById("x2").innerText = "Failed.";
    });
})();
</script>
</body>
</html>
