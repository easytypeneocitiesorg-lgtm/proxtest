<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks</title>
<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #111;
  color: #fff;
  font-family: sans-serif;
}
#x1 {
  width: 100%;
  height: 100%;
  border: none;
}
#x2 {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
</style>
</head>
<body>
<div id="x2">Loading...</div>
<iframe id="x1"></iframe>
<script>
(function() {
  function decodeBase64(str) {
    return decodeURIComponent(escape(atob(str)));
  }

  const relayBase = "https://network-altmyemail0089.wasmer.app";
  const targetOrigin = "https://core-logic-utils.github.io";

  const proxyUrl = relayBase + "/api/relay?url=" + encodeURIComponent(targetOrigin);

  fetch(proxyUrl)
    .then(function(response) {
      if (!response.ok) throw new Error("fetch failed");
      return response.text();
    })
    .then(function(html) {
      document.getElementById("x2").style.display = "none";
        
      let processed = html;
      if (processed.indexOf("<head>") !== -1) {
        processed = processed.replace(
          "<head>",
          '<head><base href="' + targetOrigin + '/">'
        );
      } else {
        processed = '<base href="' + targetOrigin + '/">' + processed;
      }

      document.getElementById("x1").srcdoc = processed;
    })
    .catch(function(err) {
      console.log("error", err);
      document.getElementById("x2").innerText = "Failed.";
    });
})();
</script>
</body>
</html>
